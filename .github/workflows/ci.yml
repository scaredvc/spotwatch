name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Actions are pinned to exact commits so a moved tag can't change what runs here.
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # The tests replace YOLO with a fake, so skip ultralytics (and the ~2 GB of PyTorch it pulls in).
      # opencv-python needs a display library the runner may lack; the headless build has the same API.
      - name: Install dependencies
        run: |
          grep -v '^ultralytics' requirements.txt | sed 's/^opencv-python/opencv-python-headless/' > ci-requirements.txt
          pip install -r ci-requirements.txt
      - name: Run tests
        run: python -m pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # scan every commit, not just the latest
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
