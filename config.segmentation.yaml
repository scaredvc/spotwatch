      '4': [[492, 459], [485, 478], [236, 468], [246, 446], [493, 458]]
      '5': [[620, 456], [612, 481], [844, 474], [843, 454], [621, 453], [620, 456]]
      '6': [[849, 452], [853, 481], [1076, 453], [1055, 433], [852, 447]]
